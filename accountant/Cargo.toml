[package]
name = "accountant"
description = "Pool accountant: subscribes to share + block events, computes PROP allocations, writes balances"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
katpool-domain = { path = "../crates/katpool-domain" }
katpool-db = { path = "../crates/katpool-db" }
# `katpool-metrics`, `katpool-idempotency`, `katpool-telemetry` will
# be wired in M4 (replay-harness + production wiring) when their
# public APIs settle; adding them now would be speculative and
# trip cargo-machete.
tokio = { workspace = true, features = ["sync", "macros", "rt-multi-thread", "time"] }
sqlx = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
prometheus = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
anyhow = "1.0"

[dev-dependencies]
proptest = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
uuid = { workspace = true }
wiremock = { workspace = true }
serde_json = { workspace = true }
