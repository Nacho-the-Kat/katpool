[package]
name = "api"
description = "Public read-only HTTP API: /health, /balance, /api/pool/*, /full_rebate/*"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Scaffold crate — every dep below is reserved for Phase 6
# (read-only HTTP API).
[package.metadata.cargo-machete]
ignored = [
    "axum",
    "chrono",
    "katpool-db",
    "katpool-domain",
    "katpool-metrics",
    "katpool-telemetry",
    "serde",
    "serde_json",
    "thiserror",
    "tokio",
    "tower",
    "tower-http",
    "tracing",
]

[dependencies]
katpool-domain = { path = "../crates/katpool-domain" }
katpool-db = { path = "../crates/katpool-db" }
katpool-metrics = { path = "../crates/katpool-metrics" }
katpool-telemetry = { path = "../crates/katpool-telemetry" }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
