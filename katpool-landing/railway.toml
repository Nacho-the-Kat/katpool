# Monorepo: set service Root Directory to /katpool-landing and Config File path to
# /katpool-landing/railway.toml in Railway service settings.
[build]
builder = "RAILPACK"
watchPatterns = ["/katpool-landing/**"]

[deploy]
healthcheckPath = "/api/hello"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
