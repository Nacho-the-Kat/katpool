[package]
name = "katpool-payout-rehearsal"
description = "One-shot KAS payout dry-run rehearsal tool: drives a single dry-run payout cycle and emits a reconcile JSON envelope (plan + mass plan, no broadcast) for operator evidence."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
katpool-db = { path = "../crates/katpool-db" }
katpool-secrets = { path = "../crates/katpool-secrets" }
payout-kas = { path = "../payout-kas" }

kaspa-addresses = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
anyhow = "1.0"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
uuid = { workspace = true }

[[bin]]
name = "katpool-payout-rehearsal"
path = "src/main.rs"
