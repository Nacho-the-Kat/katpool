[package]
name = "katpool-krc20-rehearsal"
description = "One-shot KRC-20 NACHO payout dry-run rehearsal tool: drives a single dry-run cycle (plan + floor-price quote + commit/reveal mass plan, no broadcast) and emits a reconcile JSON envelope for operator evidence."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
katpool-db = { path = "../crates/katpool-db" }
katpool-secrets = { path = "../crates/katpool-secrets" }
payout-kas = { path = "../payout-kas" }
payout-krc20 = { path = "../payout-krc20" }

kaspa-addresses = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
anyhow = "1.0"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }

[[bin]]
name = "katpool-krc20-rehearsal"
path = "src/main.rs"
