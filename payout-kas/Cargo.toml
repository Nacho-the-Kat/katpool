[package]
name = "payout-kas"
description = "KAS payout engine: daily batch payouts, storage-mass-aware, idempotent, with treasury custody hardening"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Scaffold crate — every dep below is reserved for Phase 4
# (KAS payout engine). cargo-machete reports them as unused
# because the src/ stub hasn't grown into them yet. We keep the
# list explicit so Phase 4 starts with the right dep surface
# already in workspace lockstep.
[package.metadata.cargo-machete]
ignored = [
    "async-trait",
    "chrono",
    "katpool-idempotency",
    "katpool-metrics",
    "katpool-secrets",
    "katpool-storagemass",
    "katpool-telemetry",
    "secrecy",
    "serde",
    "tokio",
    "tracing",
]

[dependencies]
katpool-domain = { path = "../crates/katpool-domain" }
katpool-db = { path = "../crates/katpool-db" }
katpool-storagemass = { path = "../crates/katpool-storagemass" }
katpool-idempotency = { path = "../crates/katpool-idempotency" }
katpool-secrets = { path = "../crates/katpool-secrets" }
katpool-metrics = { path = "../crates/katpool-metrics" }
katpool-telemetry = { path = "../crates/katpool-telemetry" }
sqlx = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
secrecy = { workspace = true }

[dev-dependencies]
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
