[workspace]
resolver = "2"
members = [
    # Shared libraries
    "crates/katpool-domain",
    "crates/katpool-config",
    "crates/katpool-db",
    "crates/katpool-metrics",
    "crates/katpool-storagemass",
    "crates/katpool-idempotency",
    "crates/katpool-telemetry",
    "crates/katpool-secrets",
    "crates/katpool-fault-injection",
    # Service crates
    "accountant",
    "payout-kas",
    "payout-krc20",
    "api",
    "katpool",
    # bridge/ is added in Phase 1 when we vendor the rusty-kaspa fork.
]

# Workspace-wide package metadata; individual crates inherit via `package.{...}.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
authors = ["Nacho the Kat <socials@onargon.com>"]
repository = "https://github.com/Nacho-the-Kat/katpool"
homepage = "https://kas.katpool.xyz"
publish = false

# Workspace-wide dependency versions. Individual crates reference via `serde = { workspace = true }`.
# Versions are bumped only via PR with a passing `cargo deny check` run.
[workspace.dependencies]
# Async runtime + utilities
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Errors
thiserror = "2"
anyhow = "1"
# Logging + tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.31"
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.30", features = ["grpc-tonic"] }
# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "migrate", "bigdecimal", "chrono", "uuid"] }
# Time
chrono = { version = "0.4", features = ["serde"] }
# Crypto / encoding
hex = "0.4"
blake2 = "0.10"
# HTTP client + server
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "timeout"] }
# Metrics
prometheus = "0.14"
# Configuration
config = { version = "0.15", default-features = false, features = ["toml", "yaml"] }
validator = { version = "0.20", features = ["derive"] }
# Secrets
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }
# Random + crypto primitives
rand = "0.9"
# Testing
proptest = "1"
testcontainers = "0.24"
mockito = "1"
insta = { version = "1", features = ["yaml", "json"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3
overflow-checks = true

[profile.dist]
inherits = "release"
debug = false

# Lints applied workspace-wide. Crates can tighten but not loosen.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_extern_crates = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
# Pedantic baseline with selected denies. Adjust only via PR + ADR if necessary.
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Explicit denies for footguns
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
integer_division = "deny"
float_arithmetic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Soften a few pedantic lints that fire on idiomatic code
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
