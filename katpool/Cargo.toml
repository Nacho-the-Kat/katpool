[package]
name = "katpool"
description = "Main wiring binary that composes the bridge, accountant, payout engines, and API into a single process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Phase 7 wiring binary, partially-active.
#
# Phase 3 M3d activates the bridge + accountant composition (the
# `katpool` binary runs the stratum bridge + the accountant event
# consumer + the maturity tracker in one process with a shared
# broadcast channel).
#
# Phase 4 will wire `payout-kas`, Phase 5 `payout-krc20`, Phase 6
# `api`, Phase 7 closes out the remaining scaffold-only deps
# (`katpool-config`, `katpool-secrets`, `katpool-telemetry`,
# `katpool-metrics`). Until each phase lands, machete must ignore
# the corresponding dep below.
[package.metadata.cargo-machete]
ignored = [
    # Phase 5/6 scaffold deps — listed here so Phase N's PR
    # can drop the entry it activates without touching the
    # rest.
    "payout-krc20",
    "api",
    # Phase 7 telemetry/metrics/config — currently no direct
    # use; wired in Phase 7's main composition.
    "katpool-config",
    "katpool-metrics",
    "katpool-telemetry",
    # Workspace deps the binary doesn't yet use; Phase 7 will.
    "thiserror",
]

[[bin]]
name = "katpool"
path = "src/main.rs"

[dependencies]
katpool-config = { path = "../crates/katpool-config" }
katpool-domain = { path = "../crates/katpool-domain" }
katpool-db = { path = "../crates/katpool-db" }
katpool-metrics = { path = "../crates/katpool-metrics" }
katpool-telemetry = { path = "../crates/katpool-telemetry" }
katpool-secrets = { path = "../crates/katpool-secrets" }
accountant = { path = "../accountant" }
payout-kas = { path = "../payout-kas" }
payout-krc20 = { path = "../payout-krc20" }
api = { path = "../api" }
# Bridge — embedded as a library so the unified runtime can run
# both the stratum server and the accountant in one process.
kaspa-stratum-bridge = { path = "../bridge" }

# Kaspad gRPC for the accountant's maturity tracker. Same node
# the bridge talks to, but a separate client connection.
kaspa-addresses = { workspace = true }
kaspa-grpc-client = { workspace = true }
kaspa-rpc-core = { workspace = true }

tokio = { workspace = true, features = ["sync", "macros", "rt-multi-thread", "time", "signal"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
