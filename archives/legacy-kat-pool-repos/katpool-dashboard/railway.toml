# Monorepo: set service Root Directory to /katpool-dashboard and Config File path to
# /katpool-dashboard/railway.toml in Railway service settings.
[build]
builder = "RAILPACK"
watchPatterns = ["/katpool-dashboard/**"]

[deploy]
healthcheckPath = "/api/hello"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
